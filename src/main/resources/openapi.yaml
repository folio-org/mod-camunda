components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        type:
          type: string
        code:
          type: string
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/Parameter"
      required:
      - message
    Parameter:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    ResponseErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Error"
        total_records:
          type: integer
          format: int32
    JsonNode:
      type: object
      properties:
        empty:
          type: boolean
        array:
          type: boolean
        "null":
          type: boolean
        object:
          type: boolean
        float:
          type: boolean
        valueNode:
          type: boolean
        container:
          type: boolean
        missingNode:
          type: boolean
        nodeType:
          type: string
          enum:
          - ARRAY
          - BINARY
          - BOOLEAN
          - MISSING
          - "NULL"
          - NUMBER
          - OBJECT
          - POJO
          - STRING
        string:
          type: boolean
        integralNumber:
          type: boolean
        pojo:
          type: boolean
        floatingPointNumber:
          type: boolean
        short:
          type: boolean
        int:
          type: boolean
        long:
          type: boolean
        double:
          type: boolean
        bigDecimal:
          type: boolean
        bigInteger:
          type: boolean
        textual:
          type: boolean
          deprecated: true
        boolean:
          type: boolean
        binary:
          type: boolean
        number:
          type: boolean
        embeddedValue:
          type: boolean
    Node:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 64
          minLength: 3
        description:
          type: string
          maxLength: 512
          minLength: 0
        deserializeAs:
          type: string
          readOnly: true
        identifier:
          type: string
      required:
      - name
    Setup:
      type: object
      properties:
        asyncAfter:
          type: boolean
        asyncBefore:
          type: boolean
    Workflow:
      type: object
      properties:
        id:
          type: string
        active:
          type: boolean
        checksum:
          type:
          - string
          - "null"
        createdOn:
          type: string
          format: date-time
        tenantId:
          type: string
        deploymentIds:
          type: array
          items:
            type: string
        description:
          type: string
          maxLength: 512
          minLength: 0
        historyTimeToLive:
          type: integer
          format: int32
          minimum: 0
        initialContext:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonNode"
        name:
          type: string
          maxLength: 64
          minLength: 4
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        setup:
          $ref: "#/components/schemas/Setup"
        updatedOn:
          type: string
          format: date-time
        versionTag:
          type: string
          maxLength: 64
          minLength: 1
      required:
      - createdOn
      - name
      - tenantId
      - updatedOn
      - versionTag
    TenantAttributes:
      type: object
      properties:
        moduleTo:
          type: string
        moduleFrom:
          type: string
    Link:
      type: object
      properties:
        href:
          type: string
        hreflang:
          type: string
        title:
          type: string
        type:
          type: string
        deprecation:
          type: string
        profile:
          type: string
        name:
          type: string
        templated:
          type: boolean
